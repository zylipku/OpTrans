# Literature baselines for Section 4.4 (real-data LTV benchmark) on the frozen design:
# same 8 targets x 3 rotations, frozen target classes (outputs/results/target_classes.json),
# the 12 candidate source tasks (30 records) of every target, and the same held-out
# scores. The registered four methods are not rerun or changed.
#
#   jm_ts   Jiao & McKeague (2025, arXiv:2506.11367v4)  coefficient-shape transfer (TS)
#   lr_atl  Lin & Reimherr (2024, ICML)                  ATL-FLR, Algorithms 2-3
#   hl_agg  Hu & Lin (2025, AAAI)                         Agg TL-FLR, Algorithm 2
#
# As for the registered methods, every choice is made on the target validation record
# (full-band normalised error) and predictions for the test input are stored before the
# test response is read. The adaptive methods fit candidates on the training record and
# aggregate them on the validation record (their second target sample). Jiao-McKeague's
# informative set is the validation-best of the nested sets ordered by estimated shape
# misalignment |sin angle(beta_j, beta_0)| (their threshold rule swept over lambda~);
# Adaptive candidates use 13 nested sets ordered by class-norm distance (LR) or
# cross-moment discrepancy (HL). Lin-Reimherr's two penalties are smoothing multipliers of
# the class regulariser tuned on validation (the registered methods keep the frozen smoothing).
# Hu-Lin's lasso uses the real and imaginary parts of complex FPC coordinates, each eigenvector
# with a canonical phase (largest entry real and positive).
version: 1
jm_truncation: [8, 16, 32, 64, 128, 256, 512, 768, 1024, 1152, 1280, 1408, 1536, 1600, 1640]   # capped at the class size p
lr_source_smooth: [1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2]                      # transfer step (lambda_1)
lr_target_smooth: [1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0, 100.0]          # calibration / OFLR (lambda_2)
hl_truncation: [64, 256, 512, 1024, 1280, 1536, 1640]   # capped at the class size p
hl_lasso: [1.0, 0.5, 0.25, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001, 0.0005, 0.0002, 0.0001, 5.0e-05,
           2.0e-05, 1.0e-05, 5.0e-06, 2.0e-06, 1.0e-06]   # registered lamj_frac grid, extended down
selection: minimum_validation_full_band_error; ties_stable_candidate_order
jobs: 6
pairing_check_rtol: 1.0e-9   # recomputed Target only vs outputs/results/all_test_scores.csv
